name: Lighthouse CI

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "src/app/**"
      - "src/components/**"
      - "package.json"
      - "lighthouserc.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse Audit (Perf, A11y, SEO)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: a1412_lhci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/a1412_lhci
      USE_LOCAL_PG: "1"
      AUTH_SECRET: ci_lhci_nextauth_secret_32_characters_min
      AUTH_URL: http://127.0.0.1:3000
      AUTH_TRUST_HOST: "true"
      AUTH_GOOGLE_ID: ci_google_id
      AUTH_GOOGLE_SECRET: ci_google_secret
      ADMIN_EMAIL: admin@example.com
      RESEND_API_KEY: re_ci_placeholder_key
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ci_cloud
      NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ci_preset

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Push Drizzle schema to Postgres
        run: pnpm exec drizzle-kit push --force

      - name: Seed sample data
        run: pnpm exec tsx scripts/seed-test.ts

      - name: Build Next.js app
        run: pnpm build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
