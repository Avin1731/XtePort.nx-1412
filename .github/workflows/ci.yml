name: CI Quality Gate

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate (Type, Lint, Build, Audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: ESLint check
        run: pnpm lint

      - name: Production build check
        env:
          DATABASE_URL: postgresql://ci_user:ci_pass@ep-ci-placeholder.us-east-2.aws.neon.tech/neondb?sslmode=require
          AUTH_SECRET: ci_placeholder_secret_for_build_only_32chars
          AUTH_GOOGLE_ID: ci_google_id
          AUTH_GOOGLE_SECRET: ci_google_secret
          ADMIN_EMAIL: admin@example.com
          RESEND_API_KEY: re_ci_placeholder_key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ci_cloud
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ci_preset
        run: pnpm build

      - name: Production security audit
        run: pnpm audit --prod --audit-level=critical
